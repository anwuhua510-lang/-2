<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>网页翻译设置</title>
  </head>
  <body>
    <main class="options">
      <h1>网页翻译设置</h1>

      <section>
        <h2>语言</h2>
        <div class="grid-2">
          <div class="field">
            <label for="target-language">目标语言</label>
            <select id="target-language">
              <option value="zh-CN">简体中文</option>
              <option value="zh-TW">繁体中文</option>
            </select>
          </div>
          <div class="field">
            <label for="source-language">源语言（默认）</label>
            <select id="source-language">
              <option value="auto">自动检测</option>
              <option value="en">英语</option>
              <option value="ja">日语</option>
            </select>
          </div>
        </div>
      </section>

      <section>
        <h2>API 引擎（第一项优先，额度用尽自动轮换到下一项）</h2>
        <div id="provider-list"></div>
        <div class="toolbar">
          <button id="add-gemini" type="button">＋ 添加 Gemini</button>
          <button id="add-openai" type="button">＋ 添加 OpenAI 兼容（Groq 等）</button>
        </div>
      </section>

      <section>
        <h2>术语表</h2>
        <div id="glossary-list"></div>
        <div class="toolbar">
          <button id="add-glossary" type="button">＋ 添加词条</button>
          <button id="load-sample" type="button">载入示例词表</button>
          <button id="export-glossary" type="button">导出 JSON</button>
          <button id="import-glossary" type="button">导入 JSON</button>
          <input id="glossary-file" type="file" accept="application/json,.json" hidden />
        </div>
      </section>

      <section>
        <h2>高级</h2>
        <div class="grid-3">
          <div class="field">
            <label for="max-blocks">单页最多文本块</label>
            <input id="max-blocks" type="number" min="1" max="5000" />
          </div>
          <div class="field">
            <label for="max-chars">每请求最大字符数</label>
            <input id="max-chars" type="number" min="500" max="32000" />
          </div>
          <div class="field">
            <label for="max-segments">每请求最多段落数</label>
            <input id="max-segments" type="number" min="1" max="200" />
          </div>
          <div class="field">
            <label for="max-retries">最大重试次数</label>
            <input id="max-retries" type="number" min="0" max="10" />
          </div>
        </div>
        <label class="check-row">
          <input id="auto-retry" type="checkbox" />
          自动重试瞬时错误
        </label>
        <label class="check-row">
          <input id="proxy-enabled" type="checkbox" />
          启用自定义 endpoint（在引擎条目中填写地址；域名需加入 manifest 的 host_permissions 后重新构建）
        </label>
      </section>

      <footer>
        <button id="save" type="button" class="primary">保存设置</button>
        <span id="save-status"></span>
      </footer>
    </main>
    <script type="module" src="./options.ts"></script>
  </body>
</html>
