<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>网页翻译</title>
  </head>
  <body>
    <main class="popup">
      <h1>网页翻译</h1>

      <label class="row master-row">
        <span>启用翻译</span>
        <input id="master-enabled" type="checkbox" />
      </label>

      <div class="field">
        <label for="source-language">源语言</label>
        <select id="source-language">
          <option value="auto">自动检测</option>
          <option value="en">英语</option>
          <option value="ja">日语</option>
        </select>
      </div>

      <div class="field">
        <label for="target-language">目标语言</label>
        <select id="target-language">
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁体中文</option>
        </select>
      </div>

      <p id="provider-info" class="muted"></p>

      <button id="translate-btn" type="button" class="primary">翻译本页</button>
      <button id="restore-btn" type="button" class="secondary" hidden>恢复原文</button>
      <p id="popup-hint" class="hint error" hidden></p>
      <button id="options-btn" type="button" class="link">打开设置…</button>
      <p id="popup-version" class="version"></p>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
